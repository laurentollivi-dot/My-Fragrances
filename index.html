<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fragrance Layering Closet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #fff5f0, #fce4ec, #f3e5f5, #fff8e7, #ffebee);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }
        .font-script {
            font-family: 'Great Vibes', cursive;
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        .font-sans-body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(243, 232, 226, 0.8);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="animated-bg min-h-full font-sans-body text-stone-800 antialiased flex flex-col selection:bg-rose-100 selection:text-rose-900">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-nav shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo Container -->
            <div class="flex items-center space-x-3 shrink-0">
                <div class="w-11 h-11 rounded-full overflow-hidden ring-2 ring-rose-200/60 shadow-inner flex items-center justify-center bg-rose-50">
                    <img src="https://images.unsplash.com/photo-1547887537-6158d64c35b3?w=500" alt="Fragrance Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/fce7f3/be185d?text=Closet'">
                </div>
            </div>

            <!-- Centered Bolder Title -->
            <div class="flex-1 text-center px-2 min-w-0">
                <h1 class="font-script text-3xl sm:text-4xl font-bold tracking-normal text-stone-900 truncate leading-tight">
                    My Layering Closet
                </h1>
            </div>

            <!-- Compact Plus Icon Button -->
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="openAddModal()" class="w-10 h-10 rounded-full bg-rose-900 hover:bg-rose-800 text-amber-50 shadow-md hover:shadow-lg transition-all flex items-center justify-center font-medium active:scale-95" title="Add Fragrance">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex space-x-8 border-t border-stone-200/40 pt-2 pb-3 text-sm font-medium">
                <button onclick="switchTab('closet')" id="tab-closet" class="tab-btn text-rose-900 border-b-2 border-rose-800 pb-1 flex items-center space-x-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>All Items (<span id="total-count">102</span>)</span>
                </button>
                <button onclick="switchTab('wizard')" id="tab-wizard" class="tab-btn text-stone-500 hover:text-stone-800 pb-1 flex items-center space-x-2">
                    <i data-lucide="wand-2" class="w-4 h-4"></i>
                    <span>Layering Wizard</span>
                </button>
                <button onclick="switchTab('favorites')" id="tab-favorites" class="tab-btn text-stone-500 hover:text-stone-800 pb-1 flex items-center space-x-2">
                    <i data-lucide="heart" class="w-4 h-4"></i>
                    <span>Saved Combos</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- SECTION 1: CLOSET VIEW -->
        <section id="view-closet" class="space-y-6">
            <!-- Filter & Search Bar -->
            <div class="glass-card rounded-2xl p-4 sm:p-6 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                        <input type="text" id="search-input" oninput="filterCloset()" placeholder="Search perfumes, lotions, oils, mists..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-stone-200 bg-white/80 focus:bg-white focus:outline-none focus:ring-2 focus:ring-rose-500/30 text-stone-800 text-sm">
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-1 sm:pb-0 no-scrollbar">
                        <button onclick="filterType('all')" class="type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-stone-900 text-white shadow-sm whitespace-nowrap" data-type="all">All</button>
                        <button onclick="filterType('Perfume')" class="type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white/80 text-stone-700 hover:bg-white border border-stone-200 whitespace-nowrap" data-type="Perfume">Perfumes</button>
                        <button onclick="filterType('Lotion')" class="type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white/80 text-stone-700 hover:bg-white border border-stone-200 whitespace-nowrap" data-type="Lotion">Lotions</button>
                        <button onclick="filterType('Oil')" class="type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white/80 text-stone-700 hover:bg-white border border-stone-200 whitespace-nowrap" data-type="Oil">Oils</button>
                        <button onclick="filterType('Mist')" class="type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white/80 text-stone-700 hover:bg-white border border-stone-200 whitespace-nowrap" data-type="Mist">Mists</button>
                    </div>
                </div>
            </div>

            <!-- Fragrance Grid -->
            <div id="fragrance-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Injected via JavaScript -->
            </div>
        </section>

        <!-- SECTION 2: WIZARD VIEW -->
        <section id="view-wizard" class="hidden space-y-6">
            <div class="glass-card rounded-2xl p-6 sm:p-8 text-center max-w-2xl mx-auto space-y-4">
                <h2 class="font-serif-title text-2xl sm:text-3xl font-bold text-stone-900">Scent Combination Generator</h2>
                <p class="text-stone-600 text-sm">Select a mood to generate a custom 3-layer fragrance ritual combining your lotions, oils, and perfumes.</p>
                
                <div class="flex flex-wrap justify-center gap-3 pt-4">
                    <button onclick="generateLayerRecipe('Sweet & Cozy')" class="px-5 py-2.5 rounded-xl bg-rose-900 text-white font-medium text-xs hover:bg-rose-800 transition-all shadow-sm">🧁 Sweet & Cozy</button>
                    <button onclick="generateLayerRecipe('Fresh & Fruity')" class="px-5 py-2.5 rounded-xl bg-amber-800 text-white font-medium text-xs hover:bg-amber-700 transition-all shadow-sm">🍑 Fresh & Fruity</button>
                    <button onclick="generateLayerRecipe('Sensual Musk')" class="px-5 py-2.5 rounded-xl bg-purple-900 text-white font-medium text-xs hover:bg-purple-800 transition-all shadow-sm">✨ Sensual Musk</button>
                </div>
            </div>

            <div id="wizard-result" class="hidden max-w-xl mx-auto glass-card rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b border-stone-200/60 pb-3">
                    <h3 id="combo-theme" class="font-serif-title font-bold text-lg text-stone-900"></h3>
                    <button onclick="generateLayerRecipe('Sweet & Cozy')" class="text-xs text-rose-800 font-semibold hover:underline">Shuffle Combo</button>
                </div>
                <div id="combo-items-container" class="space-y-3">
                    <!-- Dynamic Recipe Items -->
                </div>
            </div>
        </section>

        <!-- SECTION 3: SAVED COMBOS / FAVORITES -->
        <section id="view-favorites" class="hidden space-y-6">
            <div class="glass-card rounded-2xl p-6 sm:p-8">
                <h2 class="font-serif-title text-xl font-bold text-stone-900 mb-4">Your Favorite Items</h2>
                <div id="favorites-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Favorites Injected Here -->
                </div>
            </div>
        </section>

    </main>

    <!-- Add Fragrance Modal -->
    <div id="modal-add" class="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 relative border border-white">
            <div class="flex justify-between items-center">
                <h3 class="font-serif-title text-xl font-bold text-stone-900">Add New Fragrance</h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 hover:bg-stone-200">✕</button>
            </div>
            <form onsubmit="handleAddFragrance(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Name</label>
                    <input type="text" id="add-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Brand / House</label>
                        <input type="text" id="add-brand" required class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Type</label>
                        <select id="add-type" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                            <option value="Perfume">Perfume</option>
                            <option value="Mist">Mist</option>
                            <option value="Lotion">Lotion</option>
                            <option value="Oil">Oil</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Notes (comma separated)</label>
                    <input type="text" id="add-notes" placeholder="Vanilla, Peach, Musk" required class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-1">Photo URL</label>
                    <input type="url" id="add-image" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-white/80 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-rose-900 text-white font-medium text-sm hover:bg-rose-800 transition-all shadow-md">Save to Closet</button>
            </form>
        </div>
    </div>

            { id: 95, name: "(Homemade) Lychee", brand: "Homemade", type: "Oil", notes: ["Lychee", "Rose", "Vanilla"], rating: "5.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuMDLcdgwnoQ7X18z_iKax3Rwg2adbSAd531k3C3CKbw&s=10", favorite: true },
            { id: 96, name: "(Homemade) Berries", brand: "Homemade", type: "Oil", notes: ["Berries", "Vanilla", "Cream"], rating: "4.5", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_CdGHa_b0ZqV65nRPI0qI3OmWVLOIsQ-XfL-5u2n9eg&s=10", favorite: false },
            { id: 97, name: "Sand and Fog Vanilla Sugar", brand: "Sand & Fog", type: "Oil", notes: ["Vanilla", "Sugar", "Musk"], rating: "3.5", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvaYYG6i_yREY0hQZJ9hAKP1-j8_7AFBYhFk7fegJ_yw&s=10", favorite: false },
            
            // Mists
            { id: 98, name: "Forever 21 Pear Nectar", brand: "Forever 21", type: "Mist", notes: ["Pear", "Vanilla", "Musk"], rating: "4.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeAHwisxEXloDhg713KdIKguz0Z0IduNYkR1LpfLmMKA&s=10", favorite: false },
            { id: 99, name: "Touchland Peachy Lychee", brand: "Touchland", type: "Mist", notes: ["Peach", "Lychee", "Musk"], rating: "5.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLDK-qeRSOc4PaLCbwy8eEclp8Agqk4lkOn1LyEFmurg&s=10", favorite: true },
            { id: 100, name: "Touchland Power Essence", brand: "Touchland", type: "Mist", notes: ["Bergamot", "Rose", "Musk"], rating: "4.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOBV38JE9aqeIu3YEYGEck6HiqJLS3tyEJsio6JXYomg&s=10", favorite: false },
            { id: 101, name: "Maison Alhambra La Vivacité Mist", brand: "Maison Alhambra", type: "Mist", notes: ["Lychee", "Vanilla", "Musk"], rating: "4.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgCtIYsUwxgFr2v3V3wvmFaC1tELGc4L6eq0rQ6nVVNw&s=10", favorite: false },
            { id: 102, name: "I love Peachy Passionfruit Spritz", brand: "I Love", type: "Mist", notes: ["Peach", "Passionfruit", "Vanilla"], rating: "4.0", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTl27DAqfaGnOSjncjvQFU_EuSaXSbR5fjXpQmS5x215LPDot0ITTHaT6o&s=10", favorite: false }
        ];

        let currentTypeFilter = 'all';
        let currentNoteFilter = null;

        function renderGrid(items) {
            const grid = document.getElementById('fragrance-grid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-stone-400 text-sm">No items found matching your criteria.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="glass-card rounded-2xl overflow-hidden hover:shadow-md transition-all group flex flex-col justify-between p-3">
                    <div class="aspect-square rounded-xl overflow-hidden bg-stone-100 relative mb-3">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase bg-white/90 text-stone-800 shadow-sm">${item.type}</span>
                        <div class="absolute bottom-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-900/80 text-amber-100 backdrop-blur-sm flex items-center gap-1 shadow-sm">
                            ★ ${item.rating}
                        </div>
                        <button onclick="toggleFavorite(${item.id})" class="absolute top-2 right-2 p-1.5 rounded-full bg-white/80 hover:bg-white text-stone-700 shadow-sm transition-all">
                            <i data-lucide="heart" class="w-4 h-4 ${item.favorite ? 'fill-rose-500 text-rose-500' : ''}"></i>
                        </button>
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold text-rose-800 uppercase tracking-wider">${item.brand}</span>
                        <h4 class="font-serif-title font-semibold text-stone-900 text-sm leading-snug truncate">${item.name}</h4>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${item.notes.map(n => `<span class="px-2 py-0.5 rounded-md text-[10px] bg-stone-100 text-stone-600 font-medium">${n}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
            document.getElementById('total-count').innerText = collection.length;
            renderFavorites();
        }

        function filterCloset() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = collection.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(query) || 
                                      item.brand.toLowerCase().includes(query) ||
                                      item.notes.some(n => n.toLowerCase().includes(query));
                const matchesType = currentTypeFilter === 'all' || item.type === currentTypeFilter;
                const matchesNote = !currentNoteFilter || item.notes.includes(currentNoteFilter);
                return matchesSearch && matchesType && matchesNote;
            });
            renderGrid(filtered);
        }

        function filterType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.className = 'type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-stone-900 text-white shadow-sm whitespace-nowrap';
                } else {
                    btn.className = 'type-btn px-4 py-2 rounded-xl text-xs font-semibold bg-white/80 text-stone-700 hover:bg-white border border-stone-200 whitespace-nowrap';
                }
            });
            filterCloset();
        }

        function toggleFavorite(id) {
            const item = collection.find(i => i.id === id);
            if(item) item.favorite = !item.favorite;
            filterCloset();
        }

        function renderFavorites() {
            const favGrid = document.getElementById('favorites-grid');
            const favorites = collection.filter(i => i.favorite);

            if (favorites.length === 0) {
                favGrid.innerHTML = `<div class="col-span-full py-16 text-center text-stone-400 text-sm">No saved favorite items yet. Click the heart icon on any item!</div>`;
                return;
            }

            favGrid.innerHTML = favorites.map(item => `
                <div class="glass-card rounded-2xl overflow-hidden shadow-sm p-3 flex flex-col justify-between">
                    <div class="aspect-square rounded-xl overflow-hidden bg-stone-100 relative mb-3">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase bg-white/90 text-stone-800 shadow-sm">${item.type}</span>
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold text-rose-800 uppercase tracking-wider">${item.brand}</span>
                        <h4 class="font-serif-title font-semibold text-stone-900 text-sm leading-snug truncate">${item.name}</h4>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('text-rose-900', 'border-b-2', 'border-rose-800');
                b.classList.add('text-stone-500');
            });
            document.getElementById(`tab-${tab}`).classList.add('text-rose-900', 'border-b-2', 'border-rose-800');
            document.getElementById(`tab-${tab}`).classList.remove('text-stone-500');
        }

        function generateLayerRecipe(vibe) {
            const lotions = collection.filter(i => i.type === 'Lotion');
            const perfumes = collection.filter(i => i.type === 'Perfume');
            const mists = collection.filter(i => i.type === 'Mist');

            const base = lotions[Math.floor(Math.random() * lotions.length)] || collection[0];
            const heart = perfumes[Math.floor(Math.random() * perfumes.length)] || collection[1];
            const topper = mists[Math.floor(Math.random() * mists.length)] || collection[2];

            const resultContainer = document.getElementById('combo-items-container');
            document.getElementById('combo-theme').innerText = `${vibe.toUpperCase()} VIBE RITUAL`;

            resultContainer.innerHTML = `
                <div class="flex items-center space-x-3 p-3 bg-white/80 rounded-xl border border-stone-100 shadow-sm">
                    <img src="${base.image}" class="w-12 h-12 rounded-lg object-cover">
                    <div>
                        <span class="text-[10px] font-bold text-rose-800 uppercase">1. Base Layer (Lotion)</span>
                        <p class="font-medium text-stone-900 text-xs">${base.brand} - ${base.name}</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-white/80 rounded-xl border border-stone-100 shadow-sm">
                    <img src="${heart.image}" class="w-12 h-12 rounded-lg object-cover">
                    <div>
                        <span class="text-[10px] font-bold text-rose-800 uppercase">2. Heart Layer (Perfume)</span>
                        <p class="font-medium text-stone-900 text-xs">${heart.brand} - ${heart.name}</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3 p-3 bg-white/80 rounded-xl border border-stone-100 shadow-sm">
                    <img src="${topper.image}" class="w-12 h-12 rounded-lg object-cover">
                    <div>
                        <span class="text-[10px] font-bold text-rose-800 uppercase">3. Topper Mist</span>
                        <p class="font-medium text-stone-900 text-xs">${topper.brand} - ${topper.name}</p>
                    </div>
                </div>
            `;
            document.getElementById('wizard-result').classList.remove('hidden');
        }

        function openAddModal() { document.getElementById('modal-add').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('modal-add').classList.add('hidden'); }

        function handleAddFragrance(e) {
            e.preventDefault();
            const newItem = {
                id: collection.length + 1,
                name: document.getElementById('add-name').value,
                brand: document.getElementById('add-brand').value,
                type: document.getElementById('add-type').value,
                notes: document.getElementById('add-notes').value.split(',').map(n => n.trim()),
                rating: '5.0',
                image: document.getElementById('add-image').value || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsBwkNUN0ACZ8ZL3nJjWKbqCKSm54Qb_EU_R4jMZ8gqA&s',
                favorite: false
            };
            collection.unshift(newItem);
            renderGrid(collection);
            closeAddModal();
            e.target.reset();
        }

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderGrid(collection);
            lucide.createIcons();
        });
    </script>
</body>
</html>
